# Builds signed APKs and attaches them to a GitHub Release. Fixed file names give permanent
# direct-download links that always fetch the newest version:
#   https://github.com/yas369/Yella/releases/latest/download/Yella.apk       (offline build)
#   https://github.com/yas369/Yella/releases/latest/download/Yella-sms.apk   (automatic SMS capture)
#
# Trigger: push a tag like v0.2.0  (git tag v0.2.0 && git push origin v0.2.0)
#
# Needs four repository secrets (Settings → Secrets and variables → Actions):
#   SIGNING_KEYSTORE_BASE64  the release keystore (.jks), base64-encoded
#   SIGNING_STORE_PASSWORD   keystore password
#   SIGNING_KEY_ALIAS        key alias
#   SIGNING_KEY_PASSWORD     key password
#
# Play Protect may block Yella-sms.apk when it is installed from a downloaded file, on phones and
# in regions where its sideloading protection is active (see README "Builds"). Yella.apk declares
# no SMS permissions and installs normally.
name: Release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing. See the comment at the top of this file."
            exit 1
          fi

      - name: Restore keystore
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test
        run: ./gradlew :core:test testOfflineDebugUnitTest testSmsDebugUnitTest

      - name: Build signed APKs
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew assembleOfflineRelease assembleSmsRelease -PversionName="$VERSION" -PversionCode="${{ github.run_number }}"
          mkdir -p dist
          cp app/build/outputs/apk/offline/release/app-offline-release.apk dist/Yella.apk
          cp app/build/outputs/apk/sms/release/app-sms-release.apk dist/Yella-sms.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body: |
            **Install on Android (8.0 or newer):** tap an APK below, open it, and allow installs from your browser if asked.

            - **Yella.apk**: manual entries, daily limit, categories, lent, history, widget and alerts. Reads no SMS. Installs on any phone.
            - **Yella-sms.apk**: everything above plus automatic reading of bank SMS, only after you allow it in the app. Google Play Protect may block this file on some phones because it asks for SMS access; if it does, use Yella.apk.

            Both: no internet access, no account, everything stays on your phone.
